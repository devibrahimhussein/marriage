<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ibrahim & Amani · 12.12.2026</title>
<meta name="description" content="You're invited to our wedding — Saturday, 12 December 2026, Beirut.">
<meta property="og:title" content="Ibrahim & Amani · 12.12.2026">
<meta property="og:description" content="You're invited to our wedding — Saturday, 12 December 2026, Beirut.">
<meta property="og:image" content="images/photo-1.webp">
<meta name="theme-color" content="#f6f1e9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="images/photo-1.webp">
<style>
  :root {
    --paper: #f6f1e9;
    --ink: #2b2723;
    --muted: #7d746a;
    --gold: #a8844f;
    --line: #dcd2c3;
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "Jost", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  .page {
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  /* ---------- Slider ---------- */
  .slider { position: relative; overflow: hidden; background: #1c1916; }
  .slide {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 20%;
    opacity: 0;
    transform: scale(1.06);
    transition: opacity 1.4s ease, transform 7s ease-out;
  }
  .slide.active { opacity: 1; transform: scale(1); }
  .slider::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,.35), transparent 30%);
  }
  .nav {
    position: absolute; top: 50%; z-index: 2;
    transform: translateY(-50%);
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.5);
    background: rgba(0,0,0,.15); color: #fff;
    font-size: 18px; cursor: pointer;
    backdrop-filter: blur(4px);
    opacity: 0; transition: opacity .3s;
  }
  .slider:hover .nav { opacity: 1; }
  .nav.prev { left: 16px; } .nav.next { right: 16px; }
  .dots {
    position: absolute; bottom: 18px; left: 0; right: 0; z-index: 2;
    display: flex; justify-content: center; gap: 8px;
  }
  .dots button {
    width: 6px; height: 6px; border-radius: 3px; border: 0; padding: 0;
    background: rgba(255,255,255,.55); cursor: pointer;
    transition: width .4s, background .4s;
  }
  .dots button.active { width: 22px; background: #fff; }

  /* ---------- Card ---------- */
  .card {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: clamp(16px, 4vh, 48px) clamp(16px, 4vw, 64px);
    position: relative;
  }
  .card::before {
    content: ""; position: absolute;
    inset: clamp(10px, 2.2vh, 24px);
    border: 1px solid var(--line);
    pointer-events: none;
  }
  .eyebrow {
    font-size: clamp(10px, 1.4vh, 12px);
    letter-spacing: .32em; text-transform: uppercase;
    color: var(--muted);
  }
  .names {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(38px, 8.5vh, 84px);
    line-height: 1; margin: clamp(8px, 2vh, 20px) 0 clamp(4px, 1vh, 10px);
  }
  .names .amp { font-style: italic; color: var(--gold); padding: 0 .12em; }
  .date {
    font-family: var(--serif);
    font-size: clamp(18px, 3.2vh, 28px);
    letter-spacing: .18em;
  }
  .date-sub { font-size: clamp(11px, 1.5vh, 13px); color: var(--muted); letter-spacing: .12em; margin-top: 4px; }

  .rule {
    display: flex; align-items: center; gap: 12px;
    width: min(260px, 70%); margin: clamp(12px, 3vh, 30px) 0;
    color: var(--gold);
  }
  .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .countdown { display: flex; gap: clamp(14px, 3vw, 36px); }
  .unit { min-width: 3.2ch; }
  .num {
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(30px, 6vh, 56px); line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .lbl {
    font-size: clamp(9px, 1.2vh, 11px);
    letter-spacing: .24em; text-transform: uppercase;
    color: var(--muted); margin-top: 6px;
  }

  .details {
    display: grid; grid-template-columns: 1fr 1px 1fr; gap: clamp(12px, 2.5vw, 28px);
    align-items: center;
    margin-top: clamp(10px, 2.2vh, 24px);
    max-width: 460px; width: 100%;
  }
  .details .sep { align-self: stretch; background: var(--line); }
  .when-line {
    margin-top: clamp(12px, 3vh, 30px);
    font-family: var(--serif); font-size: clamp(16px, 2.4vh, 20px);
  }
  .when-line .dot { color: var(--gold); padding: 0 .5em; }
  .when-line span:last-child { font-family: var(--sans); font-size: .7em; color: var(--muted); }
  .map-link {
    display: inline-block; margin-top: clamp(6px, 1vh, 10px);
    font-size: clamp(10px, 1.3vh, 12px); font-weight: 400;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink); text-decoration: none;
    padding-bottom: 2px; border-bottom: 1px solid var(--gold);
    transition: color .25s;
  }
  .map-link:hover { color: var(--gold); }
  .map-link::after { content: " ↗"; }
  .detail h3 {
    font-size: clamp(9px, 1.2vh, 11px); font-weight: 500;
    letter-spacing: .24em; text-transform: uppercase; color: var(--gold);
    margin-bottom: 6px;
  }
  .detail p { font-family: var(--serif); font-size: clamp(16px, 2.4vh, 20px); line-height: 1.25; }
  .detail small { display: block; font-size: clamp(11px, 1.5vh, 13px); color: var(--muted); margin-top: 2px; }

  .actions { display: flex; gap: 10px; margin-top: clamp(14px, 3.5vh, 34px); flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: var(--sans); font-size: clamp(10px, 1.4vh, 12px); font-weight: 400;
    letter-spacing: .2em; text-transform: uppercase; text-decoration: none;
    padding: clamp(9px, 1.5vh, 12px) clamp(16px, 2vw, 22px);
    border: 1px solid var(--ink); color: var(--ink); background: transparent;
    cursor: pointer; transition: background .25s, color .25s;
  }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .btn.solid:hover { background: transparent; color: var(--ink); }

  .married { font-family: var(--serif); font-style: italic; font-size: clamp(26px, 5vh, 44px); color: var(--gold); }

  /* Fade-in */
  .card > * { opacity: 0; transform: translateY(8px); animation: rise .9s ease forwards; }
  .card > *:nth-child(2) { animation-delay: .1s; } .card > *:nth-child(3) { animation-delay: .2s; }
  .card > *:nth-child(4) { animation-delay: .3s; } .card > *:nth-child(5) { animation-delay: .4s; }
  .card > *:nth-child(6) { animation-delay: .5s; } .card > *:nth-child(7) { animation-delay: .6s; }
  .card > *:nth-child(8) { animation-delay: .7s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* ---------- Language switch ---------- */
  .lang-btn {
    position: absolute; z-index: 3;
    top: 16px; left: 16px;
    font-family: "Jost", sans-serif; font-size: 13px; font-weight: 400;
    letter-spacing: .08em;
    padding: 7px 16px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.6); background: rgba(0,0,0,.25); color: #fff;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    cursor: pointer; transition: background .25s;
  }
  .lang-btn:hover { background: rgba(0,0,0,.45); }
  .lang-btn:focus-visible, .btn:focus-visible, .map-link:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .lang-btn .ar { font-family: "Tajawal", sans-serif; font-size: 13px; letter-spacing: 0; }

  /* ---------- Arabic ---------- */
  html[dir="rtl"] {
    --serif: "Amiri", "Cormorant Garamond", serif;
    --sans: "Tajawal", "Jost", sans-serif;
  }
  html[dir="rtl"] .eyebrow, html[dir="rtl"] .lbl, html[dir="rtl"] .detail h3,
  html[dir="rtl"] .btn, html[dir="rtl"] .date-sub {
    letter-spacing: 0; text-transform: none;
  }
  html[dir="rtl"] .eyebrow { font-size: clamp(13px, 1.8vh, 15px); }
  html[dir="rtl"] .lbl { font-size: clamp(11px, 1.5vh, 13px); }
  html[dir="rtl"] .detail h3 { font-size: clamp(12px, 1.6vh, 14px); }
  html[dir="rtl"] .map-link { letter-spacing: 0; text-transform: none; font-size: clamp(12px, 1.6vh, 14px); font-weight: 500; }
  html[dir="rtl"] .map-link::after { content: " ↖"; }
  html[dir="rtl"] .btn { font-size: clamp(13px, 1.7vh, 15px); font-weight: 500; }
  html[dir="rtl"] .names { line-height: 1.3; }
  html[dir="rtl"] .names .amp { font-style: normal; padding: 0 .28em; }
  .date { direction: ltr; unicode-bidi: isolate; }
  html[dir="rtl"] .date, html[dir="rtl"] .num { font-family: "Cormorant Garamond", serif; }
  html[dir="rtl"] .married { font-style: normal; }

  /* ---------- Mobile: photo on top, card below ---------- */
  @media (max-width: 820px), (orientation: portrait) {
    .page { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
    .card { padding-block: clamp(26px, 4vh, 36px); }
    .rule { display: none; }
    .date-sub { margin-bottom: 4px; }
    .detail p { font-size: min(clamp(16px, 2.4vh, 20px), 4.4vw); }
    .nav { display: none; }
    .card { padding-inline: 16px; }
    .names { font-size: min(clamp(34px, 6.4vh, 60px), 11.5vw); }
    .num { font-size: clamp(26px, 4.6vh, 44px); }
    .details { grid-template-columns: 1fr 1px 1fr; }
  }
  @media (orientation: portrait) and (max-height: 720px) {
    .card { padding-block: 16px; }
    .card::before { inset: 8px; }
    .date-sub { margin-bottom: 10px; }
    .details { margin-top: 8px; }
    .when-line { margin-top: 10px; }
    .actions { margin-top: 12px; }
  }
  @media (max-height: 560px) and (orientation: landscape) {
    .date-sub, .rule { display: none; }
    .details { margin-top: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .slide { transition: opacity .6s; transform: none !important; }
    .card > * { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<main class="page">
  <section class="slider" aria-label="Our photos">
    <button class="nav prev" aria-label="Previous photo">&#8249;</button>
    <button class="nav next" aria-label="Next photo">&#8250;</button>
    <div class="dots" role="tablist"></div>
    <button class="lang-btn" id="langBtn" aria-label="Switch language"></button>
  </section>

  <section class="card">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 class="names"><span data-i18n="groom"></span><span class="amp" data-i18n="amp"></span><span data-i18n="bride"></span></h1>
    <p class="date">12 · 12 · 2026</p>
    <p class="date-sub" data-i18n="dateSub"></p>
    <div class="rule" aria-hidden="true">&#10086;</div>

    <div id="countdownWrap">
      <div class="countdown" aria-live="off">
        <div class="unit"><div class="num" id="d">--</div><div class="lbl" data-i18n="days"></div></div>
        <div class="unit"><div class="num" id="h">--</div><div class="lbl" data-i18n="hours"></div></div>
        <div class="unit"><div class="num" id="m">--</div><div class="lbl" data-i18n="min"></div></div>
        <div class="unit"><div class="num" id="s">--</div><div class="lbl" data-i18n="sec"></div></div>
      </div>
    </div>

    <p class="when-line"><span data-i18n="time"></span><span class="dot">·</span><span data-i18n="tz"></span></p>

    <div class="details">
      <div class="detail">
        <h3 data-i18n="men"></h3>
        <p data-i18n="menVenue"></p>
        <small data-i18n="menArea"></small>
        <a class="map-link" id="menMap" target="_blank" rel="noopener" data-i18n="directions"></a>
      </div>
      <div class="sep"></div>
      <div class="detail">
        <h3 data-i18n="women"></h3>
        <p data-i18n="womenVenue"></p>
        <small data-i18n="womenArea"></small>
        <a class="map-link" id="womenMap" target="_blank" rel="noopener" data-i18n="directions"></a>
      </div>
    </div>

    <div class="actions">
      <a class="btn" id="calBtn" target="_blank" rel="noopener" data-i18n="calendar"></a>
    </div>
  </section>
</main>

<script>
  // ============ EDIT YOUR DETAILS HERE ============
  const CONFIG = {
    // Beirut is UTC+2 in December
    date: "2026-12-12T19:00:00+02:00",
    endDate: "2026-12-12T23:59:00+02:00",
    menMapUrl: "https://www.google.com/maps/search/?api=1&query=Benawf+Mosque+Ras+Al+Nabaa+Beirut",
    womenMapUrl: "https://www.google.com/maps/search/?api=1&query=Ahmad+Naji+Fares+Hall+Beirut",
    photos: [
      // [file, focus] — lower % shows more of the top of the photo
      ["images/photo-1.webp", "50% 22%"],
      ["images/photo-2.webp", "50% 12%"],
      ["images/photo-3.webp", "50% 30%"],
    ],
    slideSeconds: 5,
  };

  const TEXT = {
    en: {
      eyebrow: "Together with their families",
      groom: "Ibrahim", amp: "&", bride: "Amani",
      dateSub: "Saturday · December",
      days: "Days", hours: "Hours", min: "Min", sec: "Sec",
      time: "7:00 PM", tz: "Beirut time",
      men: "Men", menVenue: "Benawf Mosque", menArea: "Ras Al Nabaa, Beirut",
      women: "Women", womenVenue: "Ahmad Naji Fares Hall", womenArea: "Beirut",
      directions: "Directions", calendar: "Add to calendar",
      married: "Just married",
      switchTo: '<span class="ar">عربي</span>',
    },
    ar: {
      eyebrow: "بحضور الأهل والأحبّة",
      groom: "إبراهيم", amp: "و", bride: "أماني",
      dateSub: "السبت · كانون الأول",
      days: "يوم", hours: "ساعة", min: "دقيقة", sec: "ثانية",
      time: "7:00 مساءً", tz: "بتوقيت بيروت",
      men: "للرجال", menVenue: "مسجد بن عوف", menArea: "رأس النبع، بيروت",
      women: "للنساء", womenVenue: "قاعة أحمد ناجي فارس", womenArea: "بيروت",
      directions: "الاتجاهات", calendar: "أضف إلى التقويم",
      married: "بارك الله لهما وبارك عليهما",
      switchTo: "English",
    },
  };
  // ================================================

  const $ = (id) => document.getElementById(id);
  $("menMap").href = CONFIG.menMapUrl;
  $("womenMap").href = CONFIG.womenMapUrl;

  // ---------- Language ----------
  let lang = "ar";
  try { lang = localStorage.getItem("lang") || ""; } catch (e) {}
  if (!TEXT[lang]) lang = "ar";
  function setLang(l) {
    lang = l;
    const t = TEXT[l];
    document.documentElement.lang = l;
    document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t[el.dataset.i18n]));
    $("langBtn").innerHTML = t.switchTo;
    document.title = `${t.groom} ${t.amp} ${t.bride} · 12.12.2026`;
    try { localStorage.setItem("lang", l); } catch (e) {}
  }
  $("langBtn").onclick = () => setLang(lang === "en" ? "ar" : "en");
  setLang(lang);

  // ---------- Countdown ----------
  const target = new Date(CONFIG.date).getTime();
  const pad = (n) => String(n).padStart(2, "0");
  function tick() {
    const diff = target - Date.now();
    if (diff <= 0) {
      $("countdownWrap").innerHTML = `<p class="married" data-i18n="married">${TEXT[lang].married}</p>`;
      return clearInterval(timer);
    }
    $("d").textContent = Math.floor(diff / 864e5);
    $("h").textContent = pad(Math.floor(diff / 36e5) % 24);
    $("m").textContent = pad(Math.floor(diff / 6e4) % 60);
    $("s").textContent = pad(Math.floor(diff / 1e3) % 60);
  }
  const timer = setInterval(tick, 1000);
  tick();

  // ---------- Slider ----------
  const slider = document.querySelector(".slider");
  const dots = document.querySelector(".dots");
  const slides = CONFIG.photos.map(([src, focus], i) => {
    const img = document.createElement("img");
    img.className = "slide";
    img.alt = "";
    img.decoding = "async";
    if (i > 1) img.loading = "lazy";
    img.src = src;
    img.style.objectPosition = focus;
    slider.insertBefore(img, dots);
    const dot = document.createElement("button");
    dot.setAttribute("aria-label", `Photo ${i + 1}`);
    dot.onclick = () => { go(i); restart(); };
    dots.appendChild(dot);
    return img;
  });
  let current = 0, auto;
  function go(i) {
    current = (i + slides.length) % slides.length;
    slides.forEach((s, k) => s.classList.toggle("active", k === current));
    [...dots.children].forEach((d, k) => d.classList.toggle("active", k === current));
    const next = slides[(current + 1) % slides.length];
    next.loading = "eager";
  }
  function restart() { clearInterval(auto); auto = setInterval(() => go(current + 1), CONFIG.slideSeconds * 1000); }
  document.querySelector(".prev").onclick = () => { go(current - 1); restart(); };
  document.querySelector(".next").onclick = () => { go(current + 1); restart(); };
  let startX = null;
  slider.addEventListener("touchstart", (e) => (startX = e.touches[0].clientX), { passive: true });
  slider.addEventListener("touchend", (e) => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 40) { go(current + (dx < 0 ? 1 : -1)); restart(); }
    startX = null;
  });
  go(0);
  restart();

  // ---------- Add to calendar (Google Calendar) ----------
  const fmt = (d) => new Date(d).toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  $("calBtn").href = "https://calendar.google.com/calendar/render?" + new URLSearchParams({
    action: "TEMPLATE",
    text: `${TEXT.en.groom} & ${TEXT.en.bride} Wedding`,
    dates: `${fmt(CONFIG.date)}/${fmt(CONFIG.endDate)}`,
    location: `${TEXT.en.menVenue}, ${TEXT.en.menArea}`,
    details: `Men: ${TEXT.en.menVenue}, ${TEXT.en.menArea}\n${CONFIG.menMapUrl}\n\nWomen: ${TEXT.en.womenVenue}, ${TEXT.en.womenArea}\n${CONFIG.womenMapUrl}`,
  });
</script>
</body>
</html>
